name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
    - uses: actions/checkout@v7

    # Node 25+ no longer bundles Corepack; this reads the pnpm version from packageManager.
    - name: Setup pnpm
      uses: pnpm/action-setup@v6

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}

    - name: Get pnpm store directory
      id: pnpm-cache
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

    - name: Cache pnpm store
      uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-

    - name: Cache Turborepo
      uses: actions/cache@v6
      with:
        path: .turbo
        key: ${{ runner.os }}-node${{ matrix.node-version }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-node${{ matrix.node-version }}-turbo-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint
      run: pnpm lint

    - name: Build
      run: pnpm build

    - name: Check CommonJS entry points
      run: node scripts/check-cjs-entry-points.mjs

    - name: Type Check
      run: pnpm check-types

    - name: Test
      run: pnpm test
