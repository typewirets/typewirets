name: Publish to npm

# Stages every publishable package on npm through trusted publishing (OIDC),
# waits until a maintainer approves each one on npm with 2FA, then creates the
# v<version> tag and GitHub release. Nothing is committed to the repository.
# See "Releasing" in MAINTAINING.md and docs/projects/2026-11-07-npm-release/.

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        required: true
        description: "Version to release (e.g. 0.2.0, 0.2.0-rc.1)"
      dry-run:
        type: boolean
        default: true
        description: "Dry run (check, build and pack only; stage nothing)"

# Real releases run one at a time, including the wait for approval. Each dry
# run gets its own group, so it neither waits behind a release nor cancels a
# queued one.
concurrency:
  group: ${{ inputs['dry-run'] && format('publish-dry-run-{0}', github.run_id) || 'publish' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Everything that runs repository or dependency code happens here, without
  # access to the npm OIDC token.
  build:
    name: Plan, build and pack
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.plan.outputs.packages }}
      dist-tag: ${{ steps.plan.outputs.dist-tag }}
    steps:
      - name: Require main for a real release
        if: inputs['dry-run'] == false && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release from main, not $GITHUB_REF"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # As in ci.yml: the pinned pnpm/action-setup installs the version in
      # packageManager, and the next step checks it is the one on PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Check pnpm version
        run: test "$(pnpm --version)" = "$(node -p "require('./package.json').packageManager.replace(/^pnpm@/, '')")"

      # Staging needs npm >= 11.15.0 (trusted publishing >= 11.5.1). Node 26
      # bundles npm 11.20, so nothing is installed; this only guards the minimum.
      - name: Check npm
        run: |
          npm --version
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 15)) {
              console.error(`::error::npm ${process.argv[1]} is older than 11.15.0, which staging needs`);
              process.exit(1);
            }' "$(npm --version)"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Refuses a version that isn't valid, isn't above npm's latest, has no
      # changelog section or is already tagged. Writes the plan, including the
      # packages already live (finishing a partly approved release), and sets
      # the package versions for this run only.
      - name: Plan the release
        id: plan
        run: |
          node scripts/release.mjs prepare "$VERSION" dist-release
          echo "packages=$(node -p "require('./dist-release/plan.json').packages.join(' ')")" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$(node -p "require('./dist-release/plan.json').distTag")" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm build

      - name: Check CommonJS entry points
        run: node scripts/check-cjs-entry-points.mjs

      - name: Pack
        run: node scripts/release.mjs pack "$VERSION" dist-release

      - name: Stage (dry run)
        if: inputs['dry-run'] == true
        env:
          DIST_TAG: ${{ steps.plan.outputs.dist-tag }}
        run: |
          while read -r name tarball; do
            npm stage publish "$tarball" --dry-run --access public --tag "$DIST_TAG" < /dev/null
          done < dist-release/publish-order.txt
          echo "::notice::Dry run complete: v$VERSION checks out. Re-run with dry-run unchecked to stage it on npm."

      - name: Upload the tarballs
        if: inputs['dry-run'] == false
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-tarballs
          path: |
            dist-release/*.tgz
            dist-release/publish-order.txt
          if-no-files-found: error
          retention-days: 30

  # Holds the npm OIDC token, so it runs no repository or dependency code: no
  # checkout, no install, only npm staging the tarballs the build job packed.
  stage:
    name: Stage on npm
    needs: [build]
    if: inputs['dry-run'] == false
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write
    env:
      DIST_TAG: ${{ needs.build.outputs.dist-tag }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      # Staging needs npm >= 11.15.0 (trusted publishing >= 11.5.1). Node 26
      # bundles npm 11.20, so nothing is installed; this only guards the minimum.
      - name: Check npm
        run: |
          npm --version
          node -e '
            const [major, minor] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && minor < 15)) {
              console.error(`::error::npm ${process.argv[1]} is older than 11.15.0, which staging needs`);
              process.exit(1);
            }' "$(npm --version)"

      - name: Download the tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-tarballs
          path: dist-release

      - name: Stage
        working-directory: dist-release
        run: |
          if [ ! -s publish-order.txt ]; then
            echo "Every package is already live at $VERSION; nothing to stage." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## v$VERSION is staged on npm"
            echo
            echo "Approve each package, @typewirets/core first, on npmjs.com (Staged Packages tab) or from a terminal:"
            echo
            echo '```sh'
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r name tarball; do
            npm stage publish "./$(basename "$tarball")" --access public --tag "$DIST_TAG" --json < /dev/null > stage.json
            cat stage.json
            # Best effort: the package is already staged, so a stage id that
            # can't be read must not fail the run.
            stage_id=$(node -e '
              try {
                const out = JSON.parse(require("node:fs").readFileSync("stage.json", "utf8"));
                process.stdout.write(Object.values(out)[0]?.stageId ?? out.stageId ?? "");
              } catch {}
            ')
            if [ -n "$stage_id" ]; then
              echo "npm stage approve $stage_id   # $name" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "npm stage list $name   # stage id not reported" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < publish-order.txt
          {
            echo '```'
            echo
            echo "If you reject the stages instead, cancel this run: no tag or GitHub release is created."
          } >> "$GITHUB_STEP_SUMMARY"

  # npm can't notify this run when a package is approved, and a rejected stage
  # looks the same as a pending one from outside, so this job polls the public
  # registry until a deadline. Afterwards, approve on npm and use "Re-run failed
  # jobs": that re-runs this job and the release, not the staging.
  wait-for-approval:
    name: Wait for approval on npm
    needs: [build, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {}
    env:
      PACKAGES: ${{ needs.build.outputs.packages }}
      WAIT_MINUTES: 170
    steps:
      - name: Wait until every package is live
        run: |
          echo "Approve the staged packages on npm. If you rejected them, cancel this run."
          deadline=$(( $(date +%s) + WAIT_MINUTES * 60 ))
          while true; do
            pending=()
            for name in $PACKAGES; do
              if ! curl -sf -o /dev/null "https://registry.npmjs.org/${name/\//%2f}/$VERSION"; then
                pending+=("$name")
              fi
            done
            if [ ${#pending[@]} -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Not live after $WAIT_MINUTES minutes: ${pending[*]}. If you approve them later, use Re-run failed jobs. If you rejected them, nothing more is needed: no tag or GitHub release was created."
              exit 1
            fi
            echo "$(date -u +%H:%M:%S) waiting for approval: ${pending[*]}"
            sleep 60
          done
          echo "All packages are live at $VERSION"

  release:
    name: Tag and GitHub release
    needs: [wait-for-approval]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Check provenance
        run: node scripts/release.mjs verify "$VERSION"

      - name: Write release notes
        run: node scripts/release.mjs notes "$VERSION" > release-notes.md

      # Creates the tag through the GitHub API on the commit this run built
      # from, not on the current tip of main. Nothing is pushed. The tag was
      # checked when the release was planned, but that can be hours ago: if it
      # appeared since, gh would attach the release to it, so refuse instead.
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag v$VERSION was created while this release waited; not attaching the release to it."
            exit 1
          fi
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes-file release-notes.md "${flags[@]}"
